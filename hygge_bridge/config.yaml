name: Hygge bridge
version: "1.2.0"
slug: hygge_bridge
description: Niko Home Control dashboard voor licht, klimaat en energie
url: https://github.com/yzyr7tqr5t-rgb/hygge-bridge
image: ghcr.io/yzyr7tqr5t-rgb/hygge-bridge
arch: [aarch64, amd64, armv7]
startup: application
boot: auto
init: false
ports:
  3000/tcp: 3010
ports_description:
